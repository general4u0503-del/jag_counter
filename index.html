<!DOCTYPE html>
<html lang="ja">
<head>
<link rel="apple-touch-icon" sizes="1024x1024" href="icon.png">
<link rel="icon" type="image/png" sizes="1024x1024" href="icon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ジャグラーカウンター">
<meta name="theme-color" content="#111827">
<title>ジャグラーカウンター</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Yu Gothic",Meiryo,sans-serif;background:#f3f4f6;color:#111827;touch-action:manipulation}
body{padding-bottom:max(24px,env(safe-area-inset-bottom))}
.app{max-width:900px;margin:0 auto;padding:12px}
h1{margin:4px 0 16px;text-align:center;font-size:25px;letter-spacing:.04em}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:14px;box-shadow:0 2px 9px rgba(0,0,0,.08)}
label{font-weight:700;display:block;margin-bottom:7px}
select,input{width:100%;min-height:46px;border:1px solid #cbd5e1;border-radius:10px;padding:9px 11px;font-size:17px;background:#fff;color:#111827}
.game-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.section-title{font-size:18px;font-weight:800;margin:0 0 8px}
.hint{color:#64748b;font-size:13px;margin:8px 0 0}
.counter{display:grid;grid-template-columns:minmax(0,1fr) auto 105px;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #e5e7eb}
.counter:last-child{border-bottom:0}
.counter-name{font-weight:700;line-height:1.25}
.controls{display:flex;align-items:center;gap:6px}
button{border:0;border-radius:10px;font-weight:800;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.minus,.plus{width:42px;height:42px;font-size:23px;color:#fff}
.minus{background:#475569}.plus{background:#2563eb}
.count{min-width:38px;text-align:center;font-size:19px;font-weight:800}
.rate{text-align:right;font-variant-numeric:tabular-nums;font-size:15px;color:#374151;white-space:nowrap}
.rate strong{font-size:17px;color:#111827}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;min-width:780px;font-size:13px}
th,td{border:1px solid #d1d5db;padding:7px 6px;text-align:center;white-space:nowrap}
th{background:#e5e7eb;font-weight:800}
.notes{margin:12px 0 0;padding:11px 13px;background:#f8fafc;border-radius:10px}
.notes-title{font-weight:800;margin-bottom:6px}.notes div{margin:4px 0}
@media(max-width:560px){
 .app{padding:10px}h1{font-size:22px}
 .counter{grid-template-columns:minmax(0,1fr) auto 84px}
 .counter-name{font-size:14px}.minus,.plus{width:40px;height:40px}
 .rate{font-size:13px}.rate strong{font-size:15px}
}
</style>
</head>
<body>
<div class="app">
<h1>ジャグラーカウンター</h1>

<div class="card">
<label for="machine">ジャグラー種別</label>
<select id="machine" onchange="renderMachineData()">
<option>マイジャグラーⅤ</option>
<option>ネオアイムジャグラーEX</option>
<option>ゴーゴージャグラー３</option>
<option>ファンキージャグラー２</option>
<option>ハッピージャグラーⅧ</option>
<option>ジャグラーガールズSS</option>
<option>ミスタージャグラー</option>
<option>ウルトラミラクルジャグラー</option>
</select>
</div>

<div class="card">
<div class="section-title">ゲーム数</div>
<div class="game-grid">
<div><label for="startGames">開始ゲーム数</label><input id="startGames" type="number" inputmode="numeric" min="0" step="1" placeholder="例：0" oninput="updateRates()"></div>
<div><label for="currentGames">現在ゲーム数</label><input id="currentGames" type="number" inputmode="numeric" min="0" step="1" placeholder="例：1000" oninput="updateRates()"></div>
</div>
<p class="hint">対象ゲーム数 ＝ 現在ゲーム数 − 開始ゲーム数</p>
</div>

<div class="card">
<div class="section-title">カウンター</div>
<div id="counters"></div>
</div>

<div class="card">
<div class="section-title" id="tableTitle">設定別確率</div>
<div class="table-wrap" id="tableArea"></div>
<div class="notes" id="notesArea"></div>
</div>
</div>

const COUNTERS=[['bell','ベル回数'],['singleBB','単独BB'],['singleRB','単独RB'],['cherryBB','チェリーBB'],['cherryRB','チェリーRB']];
const counts={bell:0,singleBB:0,singleRB:0,cherryBB:0,cherryRB:0};
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function renderCounters(){
 document.getElementById('counters').innerHTML=COUNTERS.map(([id,label])=>`<div class="counter"><div class="counter-name">${label}</div><div class="controls"><button class="minus" aria-label="${label}を1減らす" onclick="changeCount('${id}',-1)">−</button><div class="count" id="count-${id}">0</div><button class="plus" aria-label="${label}を1増やす" onclick="changeCount('${id}',1)">＋</button></div><div class="rate" id="rate-${id}">1/<strong>—</strong></div></div>`).join('');
}
function changeCount(id,delta){counts[id]=Math.max(0,counts[id]+delta);document.getElementById('count-'+id).textContent=counts[id];updateRates();}
function updateRates(){
 const games=Number(document.getElementById('currentGames').value)-Number(document.getElementById('startGames').value);
 COUNTERS.forEach(([id])=>{const el=document.getElementById('rate-'+id);el.innerHTML=(games>0&&counts[id]>0)?`1/<strong>${(games/counts[id]).toFixed(2)}</strong>`:'1/<strong>—</strong>';});
}
function renderMachineData(){
 const name=document.getElementById('machine').value,d=MACHINE_DATA[name];
 document.getElementById('tableTitle').textContent=name+' 設定別確率';
 let h='<table><thead><tr>'+d.h.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>';
 h+=d.r.map(row=>'<tr>'+row.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table>';
 document.getElementById('tableArea').innerHTML=h;
 document.getElementById('notesArea').innerHTML='<div class="notes-title">備考</div>'+d.n.map(x=>'<div>'+esc(x)+'</div>').join('');
}
renderCounters();renderMachineData();updateRates();
document.addEventListener('dblclick',e=>e.preventDefault());

</body>
</html>
